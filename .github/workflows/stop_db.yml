name: Stop Railway DB at night

on:
  schedule:
    - cron: '0 3 * * *'  # 3AM UTC todos los días

jobs:
  stop-db:
    runs-on: ubuntu-latest
    steps:
      - name: Stop Railway DB
        run: |
          curl -X POST https://backboard.railway.app/graphql \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"query": "mutation { serviceStop(id: \"0871de4a-ae2e-43cf-b8ca-d6f5e3768e77\") { id } }"}'
